# Temporário: baixa fotos candidatas (Unsplash/Pexels) para trocar a foto da banca.
name: Fotos banca (candidatas)
on:
  push:
    branches: [fotos-banca]
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install --quiet pillow
      - name: Baixar e montar folha
        run: |
          mkdir -p out && cd out
          baixar() { curl -sSL --max-time 60 -A "Mozilla/5.0" -o "$1.jpg" "$2" || echo "falhou $1"; }
          baixar u01-XPltBlxfChk "https://images.unsplash.com/photo-1757627550652-30788bfce978?fm=jpg&q=85&w=3000"
          baixar u02-m_2FAHuDup4 "https://images.unsplash.com/photo-1661713093950-89ff279c6610?fm=jpg&q=85&w=3000"
          baixar u03-VnIVONGhie8 "https://images.unsplash.com/photo-1598962099619-528a224cb625?fm=jpg&q=85&w=3000"
          baixar u04-OqXXSSPs4zw "https://images.unsplash.com/photo-1635341083777-5f93a755e916?fm=jpg&q=85&w=3000"
          baixar u05-rS4OSc9yhSo "https://images.unsplash.com/photo-1535202610320-919f9b13de77?fm=jpg&q=85&w=3000"
          baixar u06-M1L57tvaoyY "https://images.unsplash.com/photo-1669154777196-aca4d45b581a?fm=jpg&q=85&w=3000"
          baixar u07-8IrVwcDLsgU "https://images.unsplash.com/photo-1785076315182-98f6751997ed?fm=jpg&q=85&w=3000"
          baixar p09-868110 "https://images.pexels.com/photos/868110/pexels-photo-868110.jpeg"
          baixar p10-735536 "https://images.pexels.com/photos/735536/pexels-photo-735536.jpeg"
          baixar p11-31930012 "https://images.pexels.com/photos/31930012/pexels-photo-31930012.jpeg"
          baixar p12-319798 "https://images.pexels.com/photos/319798/pexels-photo-319798.jpeg"
          baixar p13-2255935 "https://images.pexels.com/photos/2255935/pexels-photo-2255935.jpeg"
          baixar p14-32189195 "https://images.pexels.com/photos/32189195/pexels-photo-32189195.jpeg"
          python3 - <<'PY'
          import glob, json
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          fs = sorted(glob.glob('*.jpg')); info=[]; thumbs=[]
          for f in fs:
              try:
                  im = ImageOps.exif_transpose(Image.open(f)).convert('RGB')
              except Exception as e:
                  print('erro', f, e); continue
              info.append({'arquivo': f, 'largura': im.width, 'altura': im.height})
              big = im.copy(); big.thumbnail((2400, 2400)); big.save(f, quality=88)
              t = im.copy(); t.thumbnail((600, 400)); thumbs.append((f, t, im.size))
          W, H = 620, 470; cols = 2; rows = (len(thumbs)+1)//2
          sheet = Image.new('RGB', (W*cols, H*rows), 'white'); d = ImageDraw.Draw(sheet)
          try: font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 22)
          except: font = ImageFont.load_default()
          for i, (f, t, sz) in enumerate(thumbs):
              x, y = (i % cols)*W + 10, (i // cols)*H + 10
              sheet.paste(t, (x, y)); d.text((x, y+405), f"{f}  {sz[0]}x{sz[1]}", fill='black', font=font)
          sheet.save('folha.jpg', quality=85)
          json.dump(info, open('info.json','w'), indent=1); print(json.dumps(info, indent=1))
          PY
      - name: Salvar no branch prints
        run: |
          cd "$GITHUB_WORKSPACE"
          git init -q tmp && cd tmp
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin prints && git checkout -q prints
          rm -rf fotos/fotos-banca && mkdir -p fotos/fotos-banca && cp ../out/* fotos/fotos-banca/
          git add fotos/fotos-banca && git commit -qm "Fotos candidatas da banca" && git push -q origin prints
